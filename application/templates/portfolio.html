{% extends "layout.html" %}

{% block title %}
    AI Image Generator
{% endblock %}

{% block main %}

<img src="../static/images/trianglify_background.png"
     class="background position-fixed w-100 h-100 top-0 start-0"
     loading="lazy">

<div class="container py-5">

    <div class="row mb-4">
        <div class="col text-center">
            <h1 class="page-title">AI IMAGE GENERATOR</h1>
            <p>Generate images with AI</p>
        </div>
    </div>

    <div class="row">

        <!-- Left Panel -->
        <div class="col-lg-4">

            <div class="card card-design">

                <div class="card-header">
                    Prompt
                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <textarea
                                class="form-control"
                                rows="6"
                                name="prompt"
                                placeholder="Describe your image..."
                                required></textarea>

                        </div>

                        <button
                            class="btn btn-primary w-100"
                            type="submit">

                            Generate Image

                        </button>

                    </form>

                </div>

            </div>

        </div>

        <!-- Right Panel -->
        <div class="col-lg-8">

            <div class="card card-design">

                <div class="card-header">
                    Generated Image
                </div>

                <div class="card-body text-center">

                    {% if image_url %}

                        <img
                            src="{{ image_url }}"
                            class="img-fluid rounded shadow">

                    {% else %}

                        <div class="text-muted py-5">
                            No image generated yet
                        </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
