{% extends "layout.html" %}

{% block title %}
AI Story Generator
{% endblock %}

{% block main %}

<img src="../static/images/trianglify_background.png"
     class="background position-fixed w-100 h-100 top-0 start-0"
     loading="lazy">

<div class="container py-5">

    <div class="row mb-4">
        <div class="col text-center">
            <h1 class="page-title">AI STORY GENERATOR</h1>
            <p>Generate character & story randomly</p>
        </div>
    </div>

    <div class="row">

        <!-- LEFT INPUT -->
        <div class="col-lg-4">

            <div class="card card-design">

                <div class="card-header">
                    Character Settings
                </div>

                <div class="card-body">

                    <form method="POST">

                        <!-- 職業 -->
                        <div class="mb-3">
                            <label class="form-label">Job</label>
                            <input type="text"
                                   class="form-control"
                                   name="job"
                                   placeholder="獵人, 魔法師, 醫生"
                                   required>
                        </div>

                        <!-- 性別 -->
                        <div class="mb-3">
                            <label class="form-label">Gender</label>
                            <select class="form-control" name="gender" required>
                                <option value="male">男性</option>
                                <option value="female"女性</option>
                            </select>
                        </div>

                        <!-- 身高 -->
                        <div class="mb-3">
                            <label class="form-label">Height (cm)</label>
                            <input type="number"
                                   class="form-control"
                                   name="height"
                                   placeholder="175, 186"
                                   required>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">
                            Generate Story
                        </button>

                    </form>

                </div>

            </div>

        </div>

        <!-- RIGHT OUTPUT -->
        <div class="col-lg-8">

            <div class="card card-design">

                <div class="card-header">
                    Generated Story
                </div>

                <div class="card-body">

                   {% if story %}
               
                       <div class="mb-4">
                           <h4>📖 Generated Story</h4>
                           <p style="white-space: pre-line;">{{ story }}</p>
                       </div>
               
                   {% else %}
               
                       <div class="text-muted text-center py-5">
                           No story generated yet
                       </div>
               
                   {% endif %}
               
               </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
